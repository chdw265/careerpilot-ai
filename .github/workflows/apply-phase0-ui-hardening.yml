name: Apply Phase 0 UI Hardening

on:
  push:
    branches:
      - agent/application-quality-ui
    paths:
      - scripts/harden-application-quality-ui.mjs
      - scripts/phase0-career-evidence.block.js.txt
      - scripts/phase0-readiness.block.js.txt
      - .github/workflows/apply-phase0-ui-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          ref: agent/application-quality-ui
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply hardened backend contract to page
        run: node scripts/harden-application-quality-ui.mjs

      - name: Validate hardened UI
        run: node scripts/application-quality-ui-check.mjs

      - name: Check whitespace
        run: git diff --check

      - name: Commit transformed page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden Career Evidence and readiness UI contract"
          git push origin HEAD:agent/application-quality-ui
