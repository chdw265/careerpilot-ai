name: Phase 0 Live Website Smoke

on:
  push:
    branches:
      - agent/application-quality-ui
    paths:
      - .github/workflows/phase0-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_URL: https://chdw265.github.io/careerpilot-ai/
      EXPECTED_COMMIT: 69c808d4359e165a93879e95f85b04da6c45b704
    steps:
      - name: Check out the published main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify the deployed artifact and public browser experience
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const liveUrl = process.env.LIVE_URL;
          const expectedCommit = process.env.EXPECTED_COMMIT;
          const normalize = (value) => String(value).replace(/\r\n/g, '\n').trimEnd();
          const sha256 = (value) => crypto.createHash('sha256').update(normalize(value)).digest('hex');

          (async () => {
            const deployedResponse = await fetch(`${liveUrl}?phase0=${expectedCommit}`, {
              headers: { 'cache-control': 'no-cache' },
            });
            assert.equal(deployedResponse.status, 200, 'The public website must return HTTP 200');
            assert.match(
              deployedResponse.headers.get('content-type') || '',
              /text\/html/i,
              'The public website must return HTML',
            );

            const deployedHtml = await deployedResponse.text();
            const repositoryHtml = fs.readFileSync('index.html', 'utf8');
            assert.equal(
              sha256(deployedHtml),
              sha256(repositoryHtml),
              'The deployed GitHub Pages HTML must match the merged main-branch page',
            );

            for (const marker of [
              'id="recommendedJobsButton"',
              'id="careerEvidenceBlock"',
              'id="analyzeCareerEvidenceButton"',
              'analyze-career-evidence',
              'analyze-application-readiness',
              'Have you done this but left it off your resume?',
              'not an interview or hiring probability',
            ]) {
              assert.ok(deployedHtml.includes(marker), `Missing deployed Phase 0 marker: ${marker}`);
            }
            assert.match(
              deployedHtml,
              /const CAREERPILOT_QUICK_APPLY_PROVIDERS = new Set\(\[\]\)/,
              'Quick Apply providers must remain disabled',
            );

            const browser = await chromium.launch({ headless: true });
            try {
              for (const viewport of [
                { name: 'desktop', width: 1440, height: 1000 },
                { name: 'mobile', width: 390, height: 844 },
              ]) {
                const page = await browser.newPage({
                  viewport: { width: viewport.width, height: viewport.height },
                });
                const pageErrors = [];
                const criticalConsoleErrors = [];
                const failedAssets = [];

                page.on('pageerror', (error) => pageErrors.push(String(error)));
                page.on('console', (message) => {
                  if (
                    message.type() === 'error' &&
                    /(?:Uncaught|ReferenceError|TypeError|SyntaxError)/i.test(message.text())
                  ) {
                    criticalConsoleErrors.push(message.text());
                  }
                });
                page.on('requestfailed', (request) => {
                  if (['document', 'script', 'stylesheet'].includes(request.resourceType())) {
                    failedAssets.push(`${request.resourceType()}: ${request.url()} — ${request.failure()?.errorText || 'failed'}`);
                  }
                });

                const response = await page.goto(`${liveUrl}?phase0-browser=${expectedCommit}-${viewport.name}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60_000,
                });
                assert.ok(response && response.ok(), `${viewport.name}: public page navigation must succeed`);
                await page.waitForSelector('.logo', { state: 'visible', timeout: 20_000 });
                await page.waitForTimeout(3_000);

                assert.equal((await page.locator('.logo').innerText()).trim(), 'ApplyStronger');
                assert.ok(await page.locator('#headerSignIn').isVisible(), `${viewport.name}: Sign In must be visible`);
                assert.ok(await page.locator('#headerCreateAccount').isVisible(), `${viewport.name}: Create Account must be visible`);
                assert.equal(await page.locator('#recommendedJobsButton').count(), 1);
                assert.equal(await page.locator('#careerEvidenceBlock').count(), 1);
                assert.equal(await page.locator('#job-search').count(), 1);
                assert.equal(
                  await page.evaluate(() => typeof window.supabase),
                  'object',
                  `${viewport.name}: Supabase browser library must load`,
                );

                await page.locator('#headerSignIn').click();
                await page.waitForSelector('#authModal', { state: 'visible', timeout: 10_000 });
                assert.ok(await page.locator('#authEmail').isVisible(), `${viewport.name}: email field must appear`);
                assert.ok(await page.locator('#authPassword').isVisible(), `${viewport.name}: password field must appear`);
                await page.locator('#closeAuthModal').click();

                if (viewport.name === 'mobile') {
                  const overflow = await page.evaluate(() => ({
                    viewport: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                  }));
                  assert.ok(
                    overflow.documentWidth <= overflow.viewport + 2,
                    `Mobile page has horizontal overflow: ${JSON.stringify(overflow)}`,
                  );
                }

                assert.deepEqual(pageErrors, [], `${viewport.name}: no uncaught page errors are allowed`);
                assert.deepEqual(
                  criticalConsoleErrors,
                  [],
                  `${viewport.name}: no critical console errors are allowed`,
                );
                assert.deepEqual(
                  failedAssets,
                  [],
                  `${viewport.name}: document, script, and stylesheet assets must load`,
                );
                await page.close();
              }
            } finally {
              await browser.close();
            }

            console.log('Phase 0 live website smoke passed.');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
