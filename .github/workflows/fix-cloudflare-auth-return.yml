name: Fix Cloudflare Auth Return

on:
  push:
    branches:
      - agent/cloudflare-auth-return
    paths:
      - .github/workflows/fix-cloudflare-auth-return.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-auth-return

      - name: Make auth return deployment-aware
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '    const SITE_URL = "https://chdw265.github.io/careerpilot-ai/";'
          new = '    const SITE_URL = new URL("./", window.location.href).href;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old SITE_URL line, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const SITE_URL = new URL("./", window.location.href).href;' index.html
          ! grep -F 'const SITE_URL = "https://chdw265.github.io/careerpilot-ai/";' index.html

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make auth return URL deployment-aware"
          git push origin HEAD:agent/cloudflare-auth-return
