name: Instant Apply UI

on:
  pull_request:
    paths:
      - index.html
      - instant-apply-ui.test.mjs
      - .github/workflows/instant-apply.yml
  push:
    branches: [main]
    paths:
      - index.html
      - instant-apply-ui.test.mjs
      - .github/workflows/instant-apply.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node instant-apply-ui.test.mjs

