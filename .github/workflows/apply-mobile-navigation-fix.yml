name: Apply Mobile Navigation Fix

on:
  push:
    branches:
      - fix/mobile-safari-navigation
    paths:
      - scripts/fix-mobile-safari-navigation.mjs
      - .github/workflows/apply-mobile-navigation-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-safari-navigation
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply mobile Safari navigation hardening
        run: node scripts/fix-mobile-safari-navigation.mjs

      - name: Commit the transformed page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix signed-in mobile navigation overflow"
          git push origin HEAD:fix/mobile-safari-navigation
