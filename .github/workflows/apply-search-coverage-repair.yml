name: Apply Search Coverage Repair

on:
  push:
    branches:
      - agent/search-coverage-repair
    paths:
      - .github/workflows/apply-search-coverage-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out search coverage branch
        uses: actions/checkout@v4
        with:
          ref: agent/search-coverage-repair
          fetch-depth: 0

      - name: Apply alias-aware search and missing-job report UI
        run: python scripts/apply-search-coverage-fragments.py

      - name: Run UI safety checks
        run: |
          node scripts/application-quality-ui-check.mjs
          node scripts/search-coverage-ui-check.mjs
          git diff --check

      - name: Commit repaired website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Search coverage repair is already committed."
          else
            git commit -m "Add alias-aware employer search and missing-job reporting"
            git push origin HEAD:agent/search-coverage-repair
          fi
