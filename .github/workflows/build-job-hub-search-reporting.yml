name: Build Job Hub Search Reporting

on:
  push:
    branches:
      - agent/job-hub-search-reporting
    paths:
      - .github/workflows/build-job-hub-search-reporting.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/job-hub-search-reporting
      - name: Patch Job Hub search and reporting UI
        run: python .github/scripts/patch_job_hub_search.py
      - name: Verify patch
        run: |
          grep -F 'applystronger_resolve_employer_search' index.html
          grep -F 'applystronger_report_missing_job' index.html
          grep -F 'id="jobCoveragePrompt"' index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add alias-aware employer search and missing-job reporting"
          git push origin HEAD:agent/job-hub-search-reporting
