name: Live Job Hub Verification

on:
  push:
    branches:
      - agent/live-job-hub-verification
    paths:
      - scripts/live-job-hub-browser-check.mjs
      - .github/workflows/live-job-hub-verification.yml

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify live ApplyStronger Job Hub
        run: node scripts/live-job-hub-browser-check.mjs
