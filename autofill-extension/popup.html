<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ApplyStronger Autofill</title>
    <style>
      body { width: 320px; margin: 0; font-family: Arial, Helvetica, sans-serif; color: #0f2747; background: #f6f9fc; }
      header { background: #123f7a; color: white; padding: 16px; font-weight: 700; }
      main { padding: 16px; }
      p { margin: 0 0 10px; line-height: 1.45; font-size: 14px; }
      .muted { color: #5d6f84; font-size: 12px; }
      .ready { color: #18794e; font-weight: 700; }
      button, a { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: 100%; border-radius: 9px; padding: 10px 12px; font: inherit; font-weight: 700; text-decoration: none; }
      a { background: #123f7a; color: white; }
      button { margin-top: 8px; border: 1px solid #cad5e3; background: white; color: #0f2747; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>ApplyStronger Autofill</header>
    <main>
      <div id="status"></div>
      <a href="https://applystronger.com/jobs" target="_blank" rel="noopener">Open ApplyStronger</a>
      <button id="clear" type="button">Clear current application</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
